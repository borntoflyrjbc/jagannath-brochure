<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 44" fill="none">
  <!-- Sacred Wheel / Sun Motif -->
  <g transform="translate(4, 2)">
    <circle cx="20" cy="20" r="18" stroke="#D97706" stroke-width="2" fill="#18181B"/>
    <circle cx="20" cy="20" r="12" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 2"/>
    <circle cx="20" cy="20" r="6" fill="#F59E0B"/>
    <!-- 8 Radiant spokes -->
    <line x1="20" y1="2" x2="20" y2="38" stroke="#D97706" stroke-width="1.5"/>
    <line x1="2" y1="20" x2="38" y2="20" stroke="#D97706" stroke-width="1.5"/>
    <line x1="7.3" y1="7.3" x2="32.7" y2="32.7" stroke="#D97706" stroke-width="1.5"/>
    <line x1="7.3" y1="32.7" x2="32.7" y2="7.3" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <!-- Brand Typography -->
  <text x="54" y="21" fill="#F3F4F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">JAI JAGANNATH</text>
  <text x="54" y="34" fill="#D97706" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="2">MISSION INTERNATIONAL</text>
</svg>
